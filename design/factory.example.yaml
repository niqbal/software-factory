# factory.yaml
# Lives at the repository root. Drafted by `asf init`, then owned and edited by the
# team through normal pull requests. Agents cannot edit it.
# Unset keys fall back to the safe defaults in asf/config.py.

version: 1

project:
  name: acme-web
  default_branch: main

# Each package has its own commands. Gates run only for packages whose triggers match
# the diff. {args} lets agents run one test file.
packages:
  - name: web
    root: .
    triggers: ["src/**", "shared/**"]
    ignore: ["mobile/**"]
    commands:
      lint: npx eslint .
      typecheck: npx tsc --noEmit
      build: npm run -s build
      test: npx vitest run {args}
  - name: mobile
    root: mobile
    triggers: ["mobile/**"]
    commands:
      typecheck: npx tsc --noEmit -p .
      test: npx jest {args}

tests:
  globs: ["**/*.test.*", "**/__tests__/**", "tests/**"]

# Where work comes from. Enable only what the team already uses.
intake:
  github_issues: {enabled: true, label: factory, write_back: true}
  linear: {enabled: false, team: ENG, trigger_state: "Ready for agent"}
  jira: {enabled: false, site: "https://acme.atlassian.net", jql: "labels = factory AND statusCategory != Done"}
  slack: {enabled: true}
  sentry: {enabled: true, org: acme, project: web, min_events: 20}
  pagerduty: {enabled: false}
  beads: {enabled: false, exclude_types: [epic], max_priority: 3}
  local: {enabled: true}

# local_worktree: git worktree with a scrubbed environment (laptop or CI runner).
# docker: same files, commands run in a container with no network.
execution:
  provider: local_worktree
  clone_dirs: [node_modules, mobile/node_modules]   # copy-on-write into each sandbox
  setup: []
  command_timeout_s: 900
  keep_sandboxes: false

models:
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY          # bring your own key: spend shows on your bill
  roles:
    triage:      {model: claude-haiku-5-5, effort: low}
    implementer: {model: claude-opus-5-5, effort: high}
    tester:      {model: claude-opus-5-5, effort: medium}
    reviewer:    {model: claude-opus-5-5, effort: high}
    security:    {model: claude-opus-5-5, effort: medium}
    ci_fixer:    {model: claude-opus-5-5, effort: medium}
  fallbacks: default                      # server-side fallback on refusal
  prompt_cache: true

# Path rules win over the triage classifier. A `tier:N` label overrides both.
tiers:
  rules:
    - {paths: ["docs/**", "**/*.md"], tier: 0}
    - {paths: ["**/*.test.*", "**/__tests__/**"], tier: 1}
    - {paths: ["src/auth/**", "src/billing/**", "migrations/**", "infra/**", ".github/**",
               "factory.yaml"], tier: 3}
  classifier_default: 2

# Deterministic gates always run before LLM reviewers.
gates:
  tier_0: {deterministic: [secret_scan, diff_size], llm: [], human_approvals: 0, merge: agent}
  tier_1: {deterministic: [secret_scan, diff_size, test_integrity, dependency_policy, lint, typecheck, build, test],
           llm: [reviewer], human_approvals: 0, merge: agent}
  tier_2: {deterministic: [secret_scan, diff_size, test_integrity, dependency_policy, lint, typecheck, build, test],
           llm: [reviewer, security], human_approvals: 1, merge: agent_after_approval}
  tier_3: {deterministic: [secret_scan, diff_size, test_integrity, dependency_policy, lint, typecheck, build, test],
           llm: [reviewer, security], human_approvals: 1, merge: human}

limits:
  max_changed_lines: {tier_0: 400, tier_1: 600, tier_2: 1200, tier_3: 1500}
  allow_new_dependencies_from_tier: 2
  require_tests_for_code_changes: true
  fix_rounds: 1          # implementer re-runs after tester or reviewer findings
  ci_fix_rounds: 1

# Shadow mode is on after install. Raise max_merge_tier in a reviewed PR when ready.
autonomy:
  shadow: true
  max_merge_tier: -1

# Exceeding any budget pauses the job; `asf resume JOB --extra-usd N` continues it.
budgets:
  tier_0: {usd: 0.75, minutes: 15}
  tier_1: {usd: 2.0, minutes: 30}
  tier_2: {usd: 5.0, minutes: 90}
  tier_3: {usd: 8.0, minutes: 150}
  monthly_cap_usd: 500

delivery:
  provider: github       # local_git | github | gitlab
  branch_prefix: factory/
  draft: true
  labels: [factory]

observe:
  provider: sentry       # post-deploy gate after an agent merge
  org: acme
  project: web
  window_minutes: 30
  max_new_issues: 0

permissions:
  protected_paths: [".github/**", "factory.yaml", "**/.env", "**/.env.*", "**/*.pem"]
  implementer: {may_edit_existing_tests_up_to_tier: 0}
  ci_fixer: {max_files_touched: 5}
  extra_allowed_commands: []

notifications:
  providers: [console, slack_webhook]
  slack_webhook: {url_env: SLACK_WEBHOOK_URL}
  on: [needs_human, awaiting_approval, done, failed, paused]
