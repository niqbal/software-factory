[project]
name = "asf"
version = "0.1.0"
description = "Agentic Software Factory: work items in, verified branches and PRs out, with policy-as-code gates."
requires-python = ">=3.11"
dependencies = ["anthropic>=2.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asf = "asf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asf*"]

[tool.setuptools.package-data]
"asf.agents" = ["prompts/*.md"]
"asf" = ["templates/*", "ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
